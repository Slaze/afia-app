<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Afia">
  <title>Afia TV</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Figtree:wght@400;560;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --studio: #16130f;
      --set: #241d16;
      --paper: #e6dfd2;
      --ink: #1c1612;
      --mute: #a39888;
      --live: #e23d12;
      --line: rgba(230, 223, 210, 0.14);
      --display: "Big Shoulders Display", Impact, sans-serif;
      --ui: Figtree, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--studio); overflow: hidden; }
    body { display: flex; justify-content: center; font-family: var(--ui); color: var(--paper); }
    button, a { font-family: inherit; }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: min(480px, 100%);
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      overflow: hidden;
    }
    .home { flex: 1; min-height: 0; overflow: auto; padding: 8px 18px 18px; }
    .home[hidden], .stage[hidden] { display: none; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 14px; }
    .top img { height: 22px; width: auto; }
    .clock { color: var(--mute); font: 600 12px/1 var(--ui); letter-spacing: 0.08em; }
    .live-card {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 18px 18px 16px;
      text-align: left;
      color: var(--paper);
      background:
        linear-gradient(160deg, rgba(226, 61, 18, 0.22), transparent 42%),
        var(--set);
    }
    .live-flag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--live);
      font: 700 12px/1 var(--ui);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .live-flag::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--live);
    }
    .live-card strong {
      display: block;
      margin-top: 10px;
      font: 700 52px/0.86 var(--display);
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }
    .live-card em { display: block; margin-top: 8px; color: var(--mute); font: 500 14px/1.3 var(--ui); font-style: normal; }
    h2 { margin: 22px 0 10px; color: var(--mute); font: 700 12px/1 var(--ui); letter-spacing: 0.14em; text-transform: uppercase; }
    .row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 16px 10px; }
    .row-head h2, .home .row-head h2 { margin: 0; }
    .home .row-head { margin-left: 0; margin-right: 0; }
    .follow { border: 0; background: transparent; color: var(--paper); padding: 6px 0; font: 700 12px/1 var(--ui); letter-spacing: 0.08em; text-transform: uppercase; }
    .follow[aria-pressed="true"] { color: var(--live); }
    .show-search { display: block; width: calc(100% - 32px); margin: 8px 16px 0; border: 0; border-radius: 12px; background: var(--set); color: var(--paper); padding: 12px 14px; font: 500 15px/1.2 var(--ui); }
    .return-bar { display: none; align-items: center; }
    .return-bar.show { display: flex; }
    .return-bar .return { flex: 1; }
    .share {
      display: grid; place-items: center; width: 44px; height: 44px; margin-right: 8px;
      border: 0; border-radius: 50%; background: transparent; color: var(--paper); padding: 0;
    }
    .share svg { width: 22px; height: 22px; }
    .share[hidden] { display: none; }
    .live-caption { display: none; position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 28px 16px 14px; background: linear-gradient(to top, rgba(12, 9, 7, 0.88), transparent); pointer-events: none; }
    body.watching .live-caption { display: block; }
    body.watching.layout-landscape .live-caption { display: none; }
    .live-caption b { display: block; font: 700 28px/0.95 var(--display); letter-spacing: -0.03em; text-transform: uppercase; }
    .live-caption span { display: block; margin-top: 4px; color: var(--mute); font: 500 13px/1.3 var(--ui); }
    .up-next { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 5; display: flex; align-items: center; gap: 12px; background: var(--set); color: var(--paper); border-radius: 14px; padding: 12px; }
    .up-next[hidden] { display: none; }
    .up-next p { flex: 1; margin: 0; font: 650 14px/1.3 var(--ui); }
    .up-next button { border: 0; border-radius: 999px; background: var(--live); color: white; padding: 10px 14px; font: 700 13px/1 var(--ui); }
    #ytSlot { display: none; flex: 1; min-height: 0; background: #000; }
    .stage.episode #ytSlot { display: flex; }
    .stage.episode #frame { display: none; }
    #ytSlot iframe { width: 100%; height: 100%; flex: 1; border: 0; }
    .rail { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
    .slot, .poster, .story {
      border: 0;
      text-align: left;
      color: inherit;
      background: var(--set);
    }
    .slot { flex: 0 0 168px; border-radius: 14px; padding: 12px; }
    .slot b, .poster b, .story b { display: block; font: 650 15px/1.2 var(--ui); }
    .slot span, .poster span, .story span { display: block; margin-top: 4px; color: var(--mute); font: 500 12px/1.3 var(--ui); }
    .story { display: block; width: 100%; border-radius: 0; border-top: 1px solid var(--line); background: transparent; padding: 12px 0; }
    .story b { font: 650 18px/1.15 var(--ui); }
    .poster { flex: 0 0 200px; border-radius: 14px; padding: 0 0 10px; overflow: hidden; }
    .catalogue { display: none; flex: 1; min-height: 0; overflow: auto; background: var(--studio); padding: 8px 0 24px; }
    .stage.cataloguing .catalogue { display: block; }
    .stage.cataloguing #frame,
    .stage.cataloguing .player,
    .stage.cataloguing .offline { display: none !important; }
    .programme-note { margin: 4px 16px 0; color: var(--mute); font: 500 13px/1.4 var(--ui); }
    .episode { position: relative; flex: 0 0 200px; }
    .episode .poster { width: 100%; flex: none; }
    .episode .mark {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgba(16, 14, 12, 0.72);
      color: #fff;
      padding: 0;
    }
    .episode .mark svg { width: 18px; height: 18px; display: block; }
    .episode .mark[aria-pressed="true"] { background: var(--live); }
    .poster img { width: 100%; height: 112px; object-fit: cover; display: block; background: #2c241c; }
    .poster b, .poster span { padding: 0 10px; }
    .stage { position: relative; display: flex; flex-direction: column; flex: 1; min-height: 0; background: #000; }
    iframe { width: 100%; flex: 1; min-height: 0; border: 0; background: #000; }
    .player { display: none; position: relative; flex: 1; min-height: 0; background: #000; }
    body.watching .player { display: block; }
    body.watching #frame { display: none; }
    body.watching .app { width: 100%; }
    .player-bar {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px calc(10px + env(safe-area-inset-right)) 10px calc(10px + env(safe-area-inset-left));
      background: linear-gradient(to bottom, rgba(12, 9, 7, 0.72), transparent);
      pointer-events: none;
    }
    .player-bar .grow { flex: 1; }
    .player-bar button {
      pointer-events: auto;
      flex: none;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: rgba(16, 14, 12, 0.55);
      color: #fff;
    }
    .player-bar button svg { width: 22px; height: 22px; display: block; }
    .player-screen { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #twitchMount { position: absolute; }
    #twitchMount iframe { position: absolute; inset: 0; width: 100% !important; height: 100% !important; border: 0; }
    .player-note { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: var(--paper); }
    .player-note.show { display: grid; }
    body.watching.layout-landscape .radio-row,
    body.watching.layout-landscape nav,
    body.watching.immersive .radio-row,
    body.watching.immersive nav { display: none; }
    body.watching.layout-landscape .app,
    body.watching.immersive .app { padding-top: 0; }
    body.watching.force-landscape .app {
      position: fixed;
      top: 0;
      left: 100dvw;
      width: 100dvh;
      height: 100dvw;
      max-width: none;
      transform: rotate(90deg);
      transform-origin: top left;
    }
    body.watching.force-portrait .app {
      position: fixed;
      top: 100dvh;
      left: 0;
      width: 100dvh;
      height: 100dvw;
      max-width: none;
      transform: rotate(-90deg);
      transform-origin: top left;
    }
    .offline {
      display: none;
      position: absolute;
      inset: 0;
      padding: 24px;
      background: var(--studio);
      color: var(--paper);
      overflow: auto;
    }
    .offline.show { display: flex; flex-direction: column; }
    .offline button.retry { margin: 8px 0 16px; border: 0; border-radius: 999px; background: var(--paper); color: var(--ink); padding: 12px 18px; font-weight: 700; }
    .saved-card { display: block; width: 100%; margin: 0 0 16px; padding: 0; border: 0; background: transparent; text-align: left; color: var(--paper); }
    .saved-card img { width: 100%; height: auto; display: block; border-radius: 12px; }
    .saved-card b, .saved-card span { display: block; }
    .return {
      display: none;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 0;
      background: var(--studio);
      color: var(--paper);
      padding: 10px 16px;
      padding-left: calc(16px + env(safe-area-inset-left));
      padding-right: calc(16px + env(safe-area-inset-right));
      font: 600 14px/1 var(--ui);
      text-align: left;
    }
    .return-bar.show .return { display: flex; }
    .return img { height: 18px; width: auto; }
    .return b { margin-left: auto; color: var(--live); }
    .progress { height: 2px; background: var(--live); transform-origin: left; transform: scaleX(0); }
    .progress.show { animation: load 1.1s ease forwards; }
    @keyframes load { to { transform: scaleX(1); } }
    .radio-row {
      display: flex;
      background: #100e0c;
      border-top: 1px solid var(--line);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .radio {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--paper);
      padding: 10px 14px;
      text-align: left;
    }
    .radio .mark {
      width: 36px;
      height: 36px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--live);
      color: white;
      font-size: 14px;
    }
    .radio > span:last-child { min-width: 0; flex: 1; }
    .radio b { display: block; font-size: 14px; }
    .radio small {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--mute);
      font: 500 12px/1.3 var(--ui);
    }
    nav {
      display: flex;
      background: #100e0c;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav button {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: 0;
      background: transparent;
      color: var(--mute);
      padding: 10px 0 12px;
      font: 650 11px/1 var(--ui);
    }
    nav button[aria-current="page"] { color: var(--paper); }
    .sheet {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(12, 9, 7, 0.62);
      padding-top: calc(12px + env(safe-area-inset-top));
    }
    .sheet.show { display: flex; }
    .sheet-tools { position: sticky; top: 0; z-index: 2; display: flex; background: var(--paper); }
    .sheet-tools button { flex: 1; width: auto; background: var(--paper); font: 700 16px/1 var(--ui); }
    .sheet.min { pointer-events: none; background: transparent; padding: 0 0 calc(118px + env(safe-area-inset-bottom)); }
    .sheet.min .panel { pointer-events: auto; max-height: none; overflow: hidden; padding-bottom: 8px; }
    .sheet.min .panel > :not(.sheet-tools) { display: none; }
    .panel {
      width: min(440px, 100%);
      max-height: calc(100dvh - 12px - env(safe-area-inset-top));
      overflow-y: auto;
      background: var(--paper);
      color: var(--ink);
      border-radius: 22px 22px 0 0;
      padding: 8px 8px calc(16px + env(safe-area-inset-bottom));
    }
    .panel .handle { width: 36px; height: 4px; margin: 8px auto 10px; border-radius: 4px; background: #c9c0b2; }
    .panel img.brand { height: 26px; width: auto; margin: 4px 16px 8px; }
    .guide-copy { margin: 4px 16px 12px; color: #5c5348; font: 500 14px/1.4 var(--ui); }
    .guide-block { margin: 0 12px 14px; }
    .guide-block h2 { margin: 0 0 8px; color: #8a8175; }
    .guide-card { background: var(--ink); color: var(--paper); border-radius: 12px; padding: 12px 14px; margin: 0 0 8px; }
    .guide-card b { display: block; font-size: 16px; }
    .guide-card span { display: block; color: #d7cfc2; font-size: 13px; margin-top: 2px; }
    .guide-alert, .panel button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--ink);
      padding: 14px 16px;
      font: 650 16px/1.2 var(--ui);
    }
    .guide-alert { background: var(--ink); color: var(--paper); border-radius: 12px; margin: 0 12px 12px; width: calc(100% - 24px); }
    .panel button small { display: block; margin-top: 2px; color: #6d6458; font: 500 13px/1.3 var(--ui); }
    a.credit { display: block; padding: 8px 16px 14px; color: #6d6458; font: 500 13px/1.3 var(--ui); text-decoration: none; }
    .sheet-close {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--paper);
      color: var(--ink);
      font: 700 16px/1 var(--ui);
    }
    .add-phone[hidden] { display: none; }
    .add-phone {
      display: block;
      width: 100%;
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: transparent;
      color: var(--paper);
      text-align: left;
      padding: 12px 14px;
      font: 650 14px/1.3 var(--ui);
    }
    .add-phone small { display: block; margin-top: 3px; color: var(--mute); font: 500 12px/1.3 var(--ui); }
    @media (max-height: 420px) {
      .live-card strong { font-size: 36px; }
      nav button { padding: 6px 0 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .progress.show { animation: none; transform: scaleX(1); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="return-bar" id="returnBar">
      <button class="return" id="return" type="button"><img src="afia-wordmark-white.png" alt="Afia">Home<b>Back</b></button>
      <button class="share" id="shareEpisode" type="button" hidden aria-label="Share"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 8a3 3 0 1 0-2.8-4L8.5 7.2a3 3 0 1 0 0 3.6l6.7 3.2a3 3 0 1 0 1-1.7l-6.2-3a3 3 0 0 0 0-1.6l6.2-3A3 3 0 0 0 18 8z"/></svg></button>
    </div>
    <div class="progress" id="progress"></div>
    <main class="home" id="home">
      <header class="top">
        <img src="afia-wordmark-white.png" alt="Afia">
        <time class="clock" id="clock">WAT</time>
      </header>
      <button class="live-card" id="openLive" type="button">
        <span class="live-flag">Live</span>
        <strong id="nowTitle">Afia TV</strong>
        <em id="nowMeta">Watch the channel</em>
      </button>
      <button class="add-phone" id="addPhone" type="button" hidden>Add Afia to this iPhone<small>Safari does not show an Install button. Use Share, then Add to Home Screen.</small></button>
      <section id="continueBlock" hidden>
        <h2>Continue</h2>
        <div class="rail" id="continueRail"></div>
      </section>
      <h2>Today on 99.3</h2>
      <div class="rail" id="todayRail"></div>
      <div id="statRows"></div>
      <div id="homeRows"></div>
    </main>
    <div class="stage" id="stage" hidden>
      <div class="catalogue" id="catalogue">
        <input class="show-search" id="showSearch" type="search" placeholder="Search episodes" aria-label="Search episodes">
        <p class="programme-note">Follow a programme to hear when a new episode is up. The mark keeps one for later.</p>
        <div id="programmeList"></div>
      </div>
      <div class="player" id="player">
        <div class="player-bar">
          <button type="button" id="playToggle" aria-label="Play"></button>
          <button type="button" id="muteToggle" aria-label="Mute"></button>
          <span class="grow"></span>
          <button type="button" id="turnToggle" aria-label="Landscape"></button>
          <button type="button" id="fitToggle" aria-label="Fill"></button>
          <button type="button" id="playerHome" aria-label="Home"></button>
        </div>
        <div class="player-screen">
          <div id="twitchMount"></div>
          <p class="player-note" id="playerNote"></p>
          <div class="live-caption" id="liveCaption"><b id="liveNow">Afia TV</b><span id="liveNext">Watch the channel</span></div>
        </div>
      </div>
      <div id="ytSlot"><div id="ytPlayer"></div></div>
      <iframe id="frame" title="Afia" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      <div class="up-next" id="upNext" hidden>
        <p id="upNextLabel"></p>
        <button type="button" id="upNextPlay">Play</button>
      </div>
      <div class="offline" id="offline">
        <p id="offlineText"></p>
        <button class="retry" id="retryFrame" type="button">Try again</button>
        <div id="savedList"></div>
      </div>
    </div>
    <div class="radio-row">
      <button class="radio" id="radio" type="button"><span class="mark" id="radioMark">▶</span><span><b>Afia 99.3</b><small id="radioStatus">Tap to listen</small></span></button>
    </div>
    <audio id="radioAudio" preload="none"></audio>
    <nav aria-label="Afia">
      <button type="button" data-tab="home" aria-current="page">Home</button>
      <button type="button" data-tab="live">Live</button>
      <button type="button" data-tab="listen" id="lineup">99.3</button>
      <button type="button" data-tab="library">Shows</button>
      <button type="button" id="more" data-tab="more">More</button>
    </nav>
  </div>
  <div class="sheet" id="guide">
    <div class="panel" role="dialog" aria-label="What’s on">
      <div class="sheet-tools">
        <button type="button" data-min>Minimize</button>
        <button class="sheet-close" type="button" data-close>Close</button>
      </div>
      <div class="handle"></div>
      <img class="brand" src="afia-wordmark.png" alt="Afia">
      <p class="guide-copy">Today and the week on Afia 99.3. The grid repeats, so the month follows the same shows.</p>
      <div id="guideBody"></div>
      <a class="credit" href="https://iconiaglobal.com" target="_blank" rel="noopener">Developed by Iconia Global</a>
    </div>
  </div>
  <div class="sheet" id="sheet">
    <div class="panel" role="dialog" aria-label="Afia">
      <div class="sheet-tools">
        <button type="button" data-min>Minimize</button>
        <button class="sheet-close" type="button" data-close>Close</button>
      </div>
      <div class="handle"></div>
      <img class="brand" src="afia-wordmark.png" alt="Afia">
      <button type="button" data-url="https://www.afiatv.net/obuzo">Obuzo<small>Programme page</small></button>
      <button type="button" data-url="https://www.afiatv.net/about">About Afia<small>The station</small></button>
      <button type="button" data-url="https://www.afiatv.net/contact">Reach us<small>Contact the newsroom</small></button>
      <button type="button" id="listenRadio">Afia Radio<small>Listen in the app</small></button>
      <button type="button" id="openSaved">Shows<small>Programmes and episodes to watch later</small></button>
      <button type="button" data-url="https://www.afiatv.net/privacy">Privacy<small>How Afia handles information</small></button>
      <button type="button" data-url="https://www.afiatv.net/terms">Terms<small>Terms of use</small></button>
      <button type="button" data-url="https://afiahomecoming.com/">Events<small>Afia homecoming</small></button>
      <a class="credit" href="https://iconiaglobal.com" target="_blank" rel="noopener">Developed by Iconia Global</a>
      <button type="button" id="install" hidden>Install Afia<small>Add this app to your phone</small></button>
    </div>
  </div>
    <script>
    const ORIGIN = "https://www.afiatv.net";
    const TABS = {
      news: ORIGIN + "/news",
      enugu: ORIGIN + "/enugustory",
      podcast: ORIGIN + "/podcast"
    };
    const frame = document.getElementById("frame");
    const sheet = document.getElementById("sheet");
    const offline = document.getElementById("offline");
    const back = document.getElementById("return");
    const returnBar = document.getElementById("returnBar");
    const progress = document.getElementById("progress");
    const buttons = [...document.querySelectorAll("nav button")];
    const STREAM = "https://stream.afia993.com/stream";
    const DESK = "https://iconiaglobal.com/afiatv-app/api/config.php";
    let streamList = [STREAM];
    let sourceIndex = 0;
    async function loadStreams() {
      const list = [];
      try {
        const data = await fetch(DESK).then((response) => response.json());
        if (data.radio && data.radio.enabled === false) {
          streamList = [];
          return;
        }
        if (data.radio && Array.isArray(data.radio.streams)) list.push(...data.radio.streams);
        if (data.radio && data.radio.stream) list.push(data.radio.stream);
      } catch (error) {}
      try {
        const feed = await fetch(FEED, { cache: "no-store" }).then((response) => response.json());
        if (Array.isArray(feed.streams)) list.push(...feed.streams);
      } catch (error) {}
      list.push(STREAM);
      streamList = [...new Set(list.filter((url) => typeof url === "string" && url.startsWith("http")))];
    }
    loadStreams();
    const audio = document.getElementById("radioAudio");
    const radioStatus = document.getElementById("radioStatus");
    const radioMark = document.getElementById("radioMark");
    let deferredInstall = null;
    let pausedForLive = false;

    function setRadio(status, mark) {
      radioStatus.textContent = status;
      radioMark.textContent = mark;
    }

    async function toggleRadio() {
      pausedForLive = false;
      if (!audio.paused && audio.src) {
        audio.pause();
        setRadio("Paused", "▶");
        return;
      }
      audio.muted = false;
      audio.volume = 1;
      setRadio("Connecting", "…");
      sourceIndex = 0;
      if (!streamList.length) {
        setRadio("Afia has switched the radio off for the app.", "▶");
        return;
      }
      if (audio.src !== streamList[0]) audio.src = streamList[0];
      try {
        await audio.play();
        setRadio("Live", "❚❚");
        if ("mediaSession" in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({ title: "Afia 99.3", artist: "Afia Radio" });
          navigator.mediaSession.playbackState = "playing";
        }
      } catch (error) {
        radioFail();
      }
    }

    audio.addEventListener("playing", () => setRadio("Live", "❚❚"));
    audio.addEventListener("waiting", () => {
      if (!audio.paused) setRadio("Connecting", "…");
    });
    function radioFail() {
      setRadio(navigator.onLine
        ? "Afia 99.3 didn't start. Every published stream address failed. The encoder may be off."
        : "Afia 99.3 needs a connection. Live radio cannot be saved for later.", "▶");
    }
    audio.addEventListener("error", async () => {
      sourceIndex += 1;
      if (sourceIndex < streamList.length) {
        audio.src = streamList[sourceIndex];
        try {
          await audio.play();
          return;
        } catch (error) {
          radioFail();
          return;
        }
      }
      radioFail();
    });
    document.getElementById("radio").addEventListener("click", toggleRadio);

    const guide = document.getElementById("guide");
    const guideBody = document.getElementById("guideBody");
    const RADIO_API = "https://afia-radio-backend.onrender.com/v1";
    const FEED = "https://slaze.github.io/afia-app/feed.json";
    const NEWS_QUERY = '*[_type=="news" && !(_id in path("drafts.**"))] | order(publishedAt desc)[0...6]{title,publishedAt,category,"slug":slug.current}';
    const DAYS = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];

    function lagosNow() {
      return new Date(new Date().toLocaleString("en-US", { timeZone: "Africa/Lagos" }));
    }

    function slotCard(row) {
      const show = row.show || {};
      const host = show.host && show.host.name ? show.host.name : "";
      const card = document.createElement("div");
      card.className = "guide-card";
      card.innerHTML = "<b></b><span></span>";
      card.querySelector("b").textContent = show.title || "Afia 99.3";
      card.querySelector("span").textContent = [row.startTime && row.endTime ? row.startTime + "–" + row.endTime : "", host].filter(Boolean).join(" · ");
      return card;
    }

    async function fillGuide() {
      guideBody.textContent = "Loading the lineup…";
      const start = lagosNow();
      try {
        const feed = await fetch(FEED, { cache: "no-store" }).then((response) => response.ok ? response.json() : null).catch(() => null);
        const day = DAYS[start.getDay()];
        const [onAir, today, news] = feed && Array.isArray(feed.week) && feed.week.length
          ? [feed.onAir, feed.today || [], { result: feed.news || [] }]
          : await Promise.all([
          fetch(RADIO_API + "/shows/on-air").then((response) => response.json()),
          fetch(RADIO_API + "/shows/schedule/" + day).then((response) => response.json()),
          fetch("https://p9qytxax.apicdn.sanity.io/v2021-06-07/data/query/production?query=" + encodeURIComponent(NEWS_QUERY)).then((response) => response.json()).catch(() => ({ result: [] }))
        ]);
        const week = feed && Array.isArray(feed.week) && feed.week.length ? feed.week : [];
        if (!week.length) {
          for (let offset = 0; offset < 7; offset += 1) {
            const date = new Date(start);
            date.setDate(start.getDate() + offset);
            const rows = (offset === 0 ? today : await fetch(RADIO_API + "/shows/schedule/" + DAYS[date.getDay()]).then((response) => response.json())).sort((a, b) => String(a.startTime).localeCompare(String(b.startTime)));
            week.push({ label: date.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" }), rows });
          }
        }
        localStorage.setItem("afia-guide", JSON.stringify({ savedAt: Date.now(), week }));
        guideBody.replaceChildren();
        const alert = document.createElement("button");
        alert.className = "guide-alert";
        alert.type = "button";
        alert.textContent = Notification.permission === "granted" ? "Alerts are on" : "Alert me about what’s on";
        alert.addEventListener("click", () => armPageAlerts(onAir, today, news.result || []));
        const weekBlock = document.createElement("div");
        weekBlock.className = "guide-block";
        const weekHeading = document.createElement("h2");
        weekHeading.textContent = "This week";
        weekBlock.append(weekHeading);
        week.forEach((dayRows) => {
          const heading = document.createElement("h2");
          heading.textContent = dayRows.label;
          weekBlock.append(heading, ...dayRows.rows.map(slotCard));
        });
        const todaySorted = [...today].sort((a, b) => String(a.startTime).localeCompare(String(b.startTime)));
        guideBody.append(alert, block("On now", [slotCard(onAir)]), block("Today", todaySorted.map(slotCard)), weekBlock);
        const stories = (news.result || []).map((story) => {
          const card = document.createElement("button");
          card.className = "guide-card";
          card.type = "button";
          card.innerHTML = "<b></b><span></span>";
          card.querySelector("b").textContent = story.title;
          card.querySelector("span").textContent = story.category || "News";
          const share = document.createElement("span");
          share.textContent = "Share";
          share.style.color = "#f15a22";
          share.style.display = "block";
          share.style.marginTop = "8px";
          card.append(share);
          card.addEventListener("click", async (event) => {
            const url = "https://www.afiatv.net/news/" + story.slug;
            if (event.target === share) {
              if (navigator.share) await navigator.share({ title: story.title, url });
              return;
            }
            guide.classList.remove("show");
            show(url, null);
          });
          return card;
        });
        guideBody.append(block("Stories", stories));
        if (radioStatus.textContent === "Tap to listen" && onAir.show) {
          setRadio("On now · " + onAir.show.title, "▶");
        }
        if (Notification.permission === "granted") armPageAlerts(onAir, today, news.result || []);
      } catch (error) {
        const raw = localStorage.getItem("afia-guide");
        if (!raw) {
          guideBody.textContent = navigator.onLine
            ? "The lineup didn't load. Afia's schedule server didn't answer. Try again in a moment."
            : "You're offline, and no timetable is saved on this phone yet. Open Lineup once while you have a connection.";
          return;
        }
        const saved = JSON.parse(raw);
        guideBody.replaceChildren();
        const note = document.createElement("p");
        note.textContent = "The live lineup didn't load. This is the timetable saved on this phone.";
        guideBody.append(note);
        const weekBlock = document.createElement("div");
        weekBlock.className = "guide-block";
        (saved.week || []).forEach((dayRows) => {
          const heading = document.createElement("h2");
          heading.textContent = dayRows.label;
          weekBlock.append(heading, ...(dayRows.rows || []).map(slotCard));
        });
        guideBody.append(weekBlock);
      }
    }

    function block(title, nodes) {
      const wrap = document.createElement("div");
      wrap.className = "guide-block";
      const heading = document.createElement("h2");
      heading.textContent = title;
      wrap.append(heading, ...nodes);
      return wrap;
    }

    function minutesUntil(start) {
      const parts = String(start || "").split(":");
      if (parts.length < 2) return null;
      const now = lagosNow();
      const target = new Date(now);
      target.setHours(Number(parts[0]), Number(parts[1]), 0, 0);
      return (target - now) / 60000;
    }

    async function armPageAlerts(onAir, today, stories, week) {
      const permission = await Notification.requestPermission();
      if (permission !== "granted" || !("serviceWorker" in navigator)) return;
      const registration = await navigator.serviceWorker.ready;
      const seen = JSON.parse(localStorage.getItem("afia-seen") || "{}");
      const dayKey = lagosNow().toDateString();
      if (onAir && onAir.id && seen.onAir !== onAir.id) {
        const show = onAir.show || {};
        registration.showNotification("On now · " + (show.title || "Afia 99.3"), {
          body: [show.host && show.host.name, onAir.startTime && onAir.endTime ? onAir.startTime + "–" + onAir.endTime : ""].filter(Boolean).join(" · "),
          tag: "afia-on-now",
          data: { url: "./" }
        });
      }
      if (today.length && seen.day !== dayKey) {
        registration.showNotification("Today on Afia 99.3", {
          body: today.slice(0, 4).map((row) => row.startTime + " " + (row.show ? row.show.title : "Afia")).join("\n"),
          tag: "afia-today",
          data: { url: "./" }
        });
      }
      const lineup = (week && week.length ? week : today);
      const programmeIds = lineup.map((row) => row.id).filter(Boolean);
      if (Array.isArray(seen.programmes)) {
        const added = lineup.filter((row) => row.id && !seen.programmes.includes(row.id));
        if (added.length) {
          registration.showNotification(added.length === 1 ? "New programme · " + (added[0].show ? added[0].show.title : "Afia") : added.length + " new programmes", {
            body: added.slice(0, 6).map((row) => row.startTime + " " + (row.show ? row.show.title : "Afia")).join("\n"),
            tag: "afia-new-programme",
            data: { url: "./" }
          });
        }
      }
      const upcoming = Array.isArray(seen.upcoming) ? seen.upcoming : [];
      today.forEach((row) => {
        const mins = minutesUntil(row.startTime);
        const key = dayKey + ":" + row.id;
        if (mins !== null && mins >= 5 && mins <= 50 && !upcoming.includes(key)) {
          registration.showNotification("Coming up · " + (row.show ? row.show.title : "Afia 99.3"), {
            body: [row.startTime, row.show && row.show.host && row.show.host.name].filter(Boolean).join(" · "),
            tag: "afia-up-" + row.id,
            data: { url: "./" }
          });
          upcoming.push(key);
        }
      });
      const seenNews = Array.isArray(seen.news) ? seen.news : [];
      const fresh = (stories || []).filter((story) => story.slug && Date.now() - Date.parse(story.publishedAt) < 14 * 86400000);
      if (Array.isArray(seen.news)) {
        fresh.filter((story) => !seenNews.includes(story.slug)).slice(0, 3).forEach((story) => {
          registration.showNotification(story.title, {
            body: "Afia News · " + (story.category || "Story"),
            tag: "afia-news-" + story.slug,
            data: { url: "./" }
          });
        });
      }
      localStorage.setItem("afia-seen", JSON.stringify({
        onAir: onAir && onAir.id,
        day: dayKey,
        programmes: programmeIds,
        upcoming: upcoming.filter((key) => key.startsWith(dayKey)),
        news: (stories || []).map((story) => story.slug).filter(Boolean)
      }));
      localStorage.setItem("afia-alerts", "1");
    }

    async function watchStation() {
      if (Notification.permission !== "granted") return;
      try {
        const start = lagosNow();
        const day = DAYS[start.getDay()];
        const [onAir, today, news] = await Promise.all([
          fetch(RADIO_API + "/shows/on-air").then((response) => response.json()),
          fetch(RADIO_API + "/shows/schedule/" + day).then((response) => response.json()),
          fetch("https://p9qytxax.apicdn.sanity.io/v2021-06-07/data/query/production?query=" + encodeURIComponent(NEWS_QUERY)).then((response) => response.json()).catch(() => ({ result: [] }))
        ]);
        const week = [];
        for (let offset = 0; offset < 7; offset += 1) {
          const date = new Date(start);
          date.setDate(start.getDate() + offset);
          const name = DAYS[date.getDay()];
          const rows = name === day ? today : await fetch(RADIO_API + "/shows/schedule/" + name).then((response) => response.json());
          week.push(...rows);
        }
        await armPageAlerts(onAir, today, news.result || [], week);
        await watchFollows();
      } catch (error) {
        return;
      }
    }

    if (localStorage.getItem("afia-alerts") === "1") watchStation();
    setInterval(watchStation, 15 * 60 * 1000);

    document.getElementById("lineup").addEventListener("click", () => {
      guide.classList.remove("min");
      const shrink = guide.querySelector("[data-min]");
      if (shrink) shrink.textContent = "Minimize";
      guide.classList.add("show");
      fillGuide();
    });
    guide.addEventListener("click", (event) => {
      if (event.target === guide) guide.classList.remove("show");
    });

    function markTab(tab) {
      buttons.forEach((button) => {
        if (button.dataset.tab === tab) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
    }

    let twitch = null;
    let twitchReady = false;
    let forced = null;
    const playToggle = document.getElementById("playToggle");
    const muteToggle = document.getElementById("muteToggle");
    const fitToggle = document.getElementById("fitToggle");
    const turnToggle = document.getElementById("turnToggle");
    const playerNote = document.getElementById("playerNote");
    const PICTURE = 16 / 9;
    const ICONS = {
      play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>',
      pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
      sound: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-2-3.16v6.32A3.5 3.5 0 0 0 15.5 12z"/></svg>',
      mute: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm12.2 3 2.3-2.3 1.4 1.4-2.3 2.3 2.3 2.3-1.4 1.4-2.3-2.3-2.3 2.3-1.4-1.4 2.3-2.3-2.3-2.3 1.4-1.4z"/></svg>',
      fill: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9V4h5v2H6v3H4zm10-5h5v5h-2V6h-3V4zM6 15v3h3v2H4v-5h2zm12 0h2v5h-5v-2h3v-3z"/></svg>',
      fit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 4v3H6v2h5V4H9zm5 0v5h5V7h-3V4h-2zM4 13v2h3v3h2v-5H4zm10 0v5h2v-3h3v-2h-5z"/></svg>',
      home: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 4 4 11h2v8h5v-5h2v5h5v-8h2L12 4z"/></svg>',
      turn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 0 1 4.9 6l1.9.5A7 7 0 0 0 12 5zm0 12v3l4-4-4-4v3a5 5 0 0 1-4.9-6L5.2 8.5A7 7 0 0 0 12 17z"/></svg>'
    };
    playToggle.innerHTML = ICONS.play;
    muteToggle.innerHTML = ICONS.mute;
    fitToggle.innerHTML = ICONS.fill;
    turnToggle.innerHTML = ICONS.turn;
    document.getElementById("playerHome").innerHTML = ICONS.home;

    function landscapeNow() {
      if (forced) return forced === "landscape";
      return matchMedia("(orientation: landscape)").matches;
    }

    function applyLayout() {
      const watching = document.body.classList.contains("watching");
      const deviceLandscape = matchMedia("(orientation: landscape)").matches;
      const landscape = landscapeNow();
      document.body.classList.toggle("layout-landscape", watching && (landscape || document.body.classList.contains("immersive")));
      document.body.classList.toggle("force-landscape", watching && forced === "landscape" && !deviceLandscape);
      document.body.classList.toggle("force-portrait", watching && forced === "portrait" && deviceLandscape);
      turnToggle.setAttribute("aria-label", landscape ? "Portrait" : "Landscape");
      requestAnimationFrame(fitPlayer);
    }

    function fitPlayer() {
      const box = document.querySelector(".player-screen");
      const mount = document.getElementById("twitchMount");
      const node = mount.querySelector("iframe");
      if (!box || !node) return;
      const bar = document.querySelector(".player-bar");
      const barH = bar ? bar.offsetHeight : 0;
      const bw = box.clientWidth;
      const bh = Math.max(0, box.clientHeight - barH);
      if (!bw || !bh) return;
      let width = bw;
      let height = width / PICTURE;
      if (height > bh) {
        height = bh;
        width = height * PICTURE;
      }
      mount.style.width = width + "px";
      mount.style.height = height + "px";
      mount.style.left = ((bw - width) / 2) + "px";
      mount.style.top = (barH + (bh - height) / 2) + "px";
      node.style.setProperty("width", "100%", "important");
      node.style.setProperty("height", "100%", "important");
    }

    function syncControls() {
      const paused = !twitch || !twitchReady || twitch.isPaused();
      playToggle.innerHTML = paused ? ICONS.play : ICONS.pause;
      playToggle.setAttribute("aria-label", paused ? "Play" : "Pause");
      const muted = !twitch || !twitchReady || twitch.getMuted();
      muteToggle.innerHTML = muted ? ICONS.mute : ICONS.sound;
      muteToggle.setAttribute("aria-label", muted ? "Sound" : "Mute");
      const filled = document.body.classList.contains("immersive");
      fitToggle.innerHTML = filled ? ICONS.fit : ICONS.fill;
      fitToggle.setAttribute("aria-label", filled ? "Fit" : "Fill");
    }

    function ensurePlayer() {
      if (twitch) return;
      const boot = () => {
        try {
          twitch = new Twitch.Player("twitchMount", {
            width: "100%",
            height: "100%",
            channel: "afiatv_official",
            parent: [location.hostname],
            autoplay: true,
            muted: false
          });
        } catch (error) {
          playerNote.textContent = "The live player didn't open on this phone. Try again.";
          playerNote.classList.add("show");
          return;
        }
        twitch.addEventListener(Twitch.Player.READY, () => {
          twitchReady = true;
          hearLive();
          playerNote.classList.remove("show");
          syncControls();
          fitPlayer();
        });
        ["PLAY", "PLAYING", "PAUSE"].forEach((name) => {
          if (Twitch.Player[name]) twitch.addEventListener(Twitch.Player[name], syncControls);
        });
        setTimeout(fitPlayer, 600);
      };
      if (window.Twitch && window.Twitch.Player) boot();
      else {
        const script = document.createElement("script");
        script.src = "https://player.twitch.tv/js/embed/v1.js";
        script.onload = boot;
        script.onerror = () => {
          playerNote.textContent = "The live player didn't load. Check the connection and try again.";
          playerNote.classList.add("show");
        };
        document.head.appendChild(script);
      }
    }

    function leaveLive() {
      document.body.classList.remove("watching", "immersive", "layout-landscape", "force-landscape", "force-portrait");
      forced = null;
      try { screen.orientation.unlock(); } catch (error) { /* this phone keeps the system rotation */ }
      syncControls();
      if (twitch && twitchReady) {
        try { twitch.pause(); } catch (error) { /* player already gone */ }
      }
    }

    function hearLive() {
      if (!twitch) return;
      try { twitch.setMuted(false); } catch (error) { /* player not ready */ }
      try { twitch.setVolume(1); } catch (error) { /* volume follows the mute switch */ }
    }

    function showLive() {
      if (audio.src && !audio.paused) {
        pausedForLive = true;
        audio.pause();
        setRadio("Paused for live TV", "▶");
      }
      document.getElementById("home").hidden = true;
      const stage = document.getElementById("stage");
      stage.hidden = false;
      stage.classList.remove("cataloguing");
      offline.classList.remove("show");
      returnBar.classList.remove("show");
      document.getElementById("stage").classList.remove("episode");
      document.getElementById("upNext").hidden = true;
      pauseEpisode();
      document.body.classList.add("watching");
      markTab("live");
      ensurePlayer();
      if (twitch && twitchReady) {
        hearLive();
        try { twitch.play(); } catch (error) { /* autoplay can be blocked until a tap */ }
      }
      applyLayout();
    }

    function showHome() {
      leaveLive();
      document.getElementById("home").hidden = false;
      const stage = document.getElementById("stage");
      stage.hidden = true;
      stage.classList.remove("cataloguing", "episode");
      document.getElementById("upNext").hidden = true;
      pauseEpisode();
      returnBar.classList.remove("show");
      offline.classList.remove("show");
      markTab("home");
    }

    function show(url, tab) {
      leaveLive();
      document.getElementById("home").hidden = true;
      const stage = document.getElementById("stage");
      stage.hidden = false;
      stage.classList.remove("cataloguing", "episode");
      document.getElementById("upNext").hidden = true;
      pauseEpisode();
      offline.classList.remove("show");
      progress.classList.remove("show");
      void progress.offsetWidth;
      progress.classList.add("show");
      if (frame.src !== url) frame.src = url;
      returnBar.classList.toggle("show", tab !== "live");
      markTab(tab);
    }

    frame.addEventListener("load", () => progress.classList.remove("show"));
    back.addEventListener("click", showHome);
    document.getElementById("openLive").addEventListener("click", showLive);
    document.getElementById("playerHome").addEventListener("click", showHome);
    playToggle.addEventListener("click", () => {
      if (!twitch || !twitchReady) {
        ensurePlayer();
        return;
      }
      if (twitch.isPaused()) twitch.play();
      else twitch.pause();
      syncControls();
    });
    muteToggle.addEventListener("click", () => {
      if (!twitch || !twitchReady) return;
      twitch.setMuted(!twitch.getMuted());
      syncControls();
    });
    fitToggle.addEventListener("click", () => {
      document.body.classList.toggle("immersive");
      syncControls();
      applyLayout();
    });
    turnToggle.addEventListener("click", () => {
      forced = landscapeNow() ? "portrait" : "landscape";
      const lock = screen.orientation && screen.orientation.lock;
      if (lock) lock.call(screen.orientation, forced).catch(() => {});
      applyLayout();
    });
    matchMedia("(orientation: landscape)").addEventListener("change", () => {
      forced = null;
      try { screen.orientation.unlock(); } catch (error) { /* already following the phone */ }
      if (document.body.classList.contains("watching")) applyLayout();
    });
    window.addEventListener("resize", () => {
      if (document.body.classList.contains("watching")) fitPlayer();
    });

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        if (button.dataset.tab === "more") {
          sheet.classList.remove("min");
          const shrink = sheet.querySelector("[data-min]");
          if (shrink) shrink.textContent = "Minimize";
          sheet.classList.add("show");
          return;
        }
        if (button.dataset.tab === "home") {
          showHome();
          return;
        }
        if (button.dataset.tab === "live") {
          showLive();
          return;
        }
        if (button.dataset.tab === "listen") return;
        if (button.dataset.tab === "library") {
          openLibrary();
          return;
        }
        show(TABS[button.dataset.tab], button.dataset.tab);
      });
    });

    sheet.addEventListener("click", (event) => {
      if (event.target === sheet) sheet.classList.remove("show");
    });

    document.getElementById("listenRadio").addEventListener("click", () => {
      sheet.classList.remove("show");
      if (audio.paused) toggleRadio();
    });

    document.querySelectorAll(".panel [data-url]").forEach((button) => {
      button.addEventListener("click", () => {
        sheet.classList.remove("show");
        show(button.dataset.url, null);
      });
    });

    const VIDEO_QUERY = '*[_type=="videos" && !(_id in path("drafts.**"))] | order(publishedAt desc)[0...12]{title,description,publishedAt,embedUrl,"thumbnail":thumbnail.asset->url}';
    const STORY_QUERY = '*[_type=="news" && !(_id in path("drafts.**"))] | order(publishedAt desc)[0...8]{title,description,publishedAt,category,"slug":slug.current}';

    function sanity(query) {
      return "https://p9qytxax.apicdn.sanity.io/v2021-06-07/data/query/production?query=" + encodeURIComponent(query);
    }

    function whenLabel(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    }

    async function refreshLibrary() {
      try {
        const feed = await fetch(FEED, { cache: "no-store" }).then((response) => response.ok ? response.json() : null).catch(() => null);
        await ensureProgrammes();
        paintHome(feed);
        const [videos, stories] = feed && Array.isArray(feed.episodes)
          ? [{ result: feed.episodes }, { result: feed.stories || [] }]
          : await Promise.all([
          fetch(sanity(VIDEO_QUERY)).then((response) => response.json()),
          fetch(sanity(STORY_QUERY)).then((response) => response.json())
        ]);
        const cache = await caches.open("afia-library-1");
        const pieces = [];
        for (const row of videos.result || []) {
          let thumb = "";
          if (typeof row.thumbnail === "string" && row.thumbnail.startsWith("https://cdn.sanity.io/")) {
            thumb = row.thumbnail + "?w=640&h=360&fit=crop";
            const image = await fetch(thumb);
            if (image.ok) await cache.put(thumb, image.clone());
          }
          pieces.push({
            title: row.title || "Afia",
            detail: String(row.description || "").slice(0, 320),
            when: whenLabel(row.publishedAt),
            url: row.embedUrl || "",
            thumb,
            kind: "Episode"
          });
        }
        for (const row of stories.result || []) {
          pieces.push({
            title: row.title || "Afia",
            detail: String(row.description || "").slice(0, 320),
            when: whenLabel(row.publishedAt),
            url: row.slug ? "https://www.afiatv.net/news/" + row.slug : "",
            thumb: "",
            kind: row.category || "Story"
          });
        }
        localStorage.setItem("afia-library", JSON.stringify({ savedAt: Date.now(), pieces }));
        paintHome(feed);
      } catch (error) {
        return;
      }
    }

    async function paintSaved() {
      const savedList = document.getElementById("savedList");
      savedList.replaceChildren();
      const raw = localStorage.getItem("afia-library");
      if (!raw) {
        const empty = document.createElement("p");
        empty.textContent = "Nothing is saved yet. Open Afia once while you are online and the latest episodes stay on this phone.";
        savedList.append(empty);
        return;
      }
      const saved = JSON.parse(raw);
      const note = document.createElement("p");
      const stamp = new Date(saved.savedAt);
      note.textContent = "Saved " + stamp.toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      savedList.append(note);
      const cache = await caches.open("afia-library-1");
      for (const piece of saved.pieces || []) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "saved-card";
        if (piece.thumb) {
          const hit = await cache.match(piece.thumb);
          if (hit) {
            const img = document.createElement("img");
            img.alt = "";
            img.src = URL.createObjectURL(await hit.blob());
            card.append(img);
          }
        }
        const title = document.createElement("b");
        title.textContent = piece.title;
        const meta = document.createElement("span");
        meta.textContent = [piece.kind, piece.when, navigator.onLine ? "" : "Needs a connection to play"].filter(Boolean).join(" · ");
        card.append(title, meta);
        if (piece.detail) {
          const detail = document.createElement("span");
          detail.textContent = piece.detail;
          card.append(detail);
        }
        card.addEventListener("click", () => {
          const id = youtubeId(piece.url);
          if (!navigator.onLine || !id) return;
          offline.classList.remove("show");
          watchEpisode(id, "", piece.title);
        });
        savedList.append(card);
      }
    }

    const MARK = {
      off: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4h10a1 1 0 0 1 1 1v15l-6-3-6 3V5a1 1 0 0 1 1-1zm1 2v10.2l4-2 4 2V6H8z"/></svg>',
      on: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4h10a1 1 0 0 1 1 1v15l-6-3-6 3V5a1 1 0 0 1 1-1z"/></svg>'
    };
    let programmes = null;

    function laterItems() {
      try { return JSON.parse(localStorage.getItem("afia-later") || "[]"); }
      catch (error) { return []; }
    }

    function youtubeId(url) {
      const match = String(url || "").match(/(?:youtu\.be\/|live\/|embed\/|v=)([\w-]{6,})/);
      return match ? match[1] : "";
    }

    const HOME_SHOWS = ["THE AM SHOW", "ENUGU KWENU", "SPORTS", "EASTERN EYE"];
    let ytPlayer = null;
    let currentEpisode = null;
    let progressTimer = null;

    function follows() {
      try { return JSON.parse(localStorage.getItem("afia-follows") || "[]"); }
      catch (error) { return []; }
    }

    function progressMap() {
      try { return JSON.parse(localStorage.getItem("afia-progress") || "{}"); }
      catch (error) { return {}; }
    }

    function pauseEpisode() {
      if (progressTimer) clearInterval(progressTimer);
      try {
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
      } catch (error) { /* player not ready */ }
    }

    function rememberSpot() {
      if (!currentEpisode || !ytPlayer || !ytPlayer.getCurrentTime) return;
      const seconds = Math.floor(ytPlayer.getCurrentTime() || 0);
      const duration = ytPlayer.getDuration ? ytPlayer.getDuration() : 0;
      if (seconds < 5 || (duration && seconds > duration - 15)) return;
      const map = progressMap();
      const spot = { id: currentEpisode.id, title: currentEpisode.title, section: currentEpisode.section, seconds, at: Date.now() };
      map[currentEpisode.id] = spot;
      localStorage.setItem("afia-progress", JSON.stringify(map));
      localStorage.setItem("afia-last", JSON.stringify(spot));
    }

    function nextAfter(episode) {
      if (!episode || !programmes) return null;
      const section = (programmes.sections || []).find((row) => row.title === episode.section);
      if (!section) return null;
      const index = (section.episodes || []).findIndex((row) => row.id === episode.id);
      const next = section.episodes[index + 1];
      return next ? { id: next.id, title: next.title, section: section.title } : null;
    }

    function offerNext() {
      const next = nextAfter(currentEpisode);
      const bar = document.getElementById("upNext");
      if (!currentEpisode || !next) {
        bar.hidden = true;
        return;
      }
      const map = progressMap();
      delete map[currentEpisode.id];
      localStorage.setItem("afia-progress", JSON.stringify(map));
      localStorage.setItem("afia-last", JSON.stringify({ id: next.id, title: next.title, section: next.section, seconds: 0, at: Date.now() }));
      document.getElementById("upNextLabel").textContent = "Next · " + next.title;
      bar.dataset.id = next.id;
      bar.dataset.section = next.section;
      bar.dataset.title = next.title;
      bar.hidden = false;
    }

    let heardEpisode = "";

    function hearEpisode() {
      if (!ytPlayer || !ytPlayer.unMute) return;
      try {
        ytPlayer.unMute();
        ytPlayer.setVolume(100);
      } catch (error) { /* the player is still opening */ }
    }

    function onEpisodeState(event) {
      if (!window.YT || !ytPlayer) return;
      if (event.data === YT.PlayerState.PLAYING && currentEpisode && heardEpisode !== currentEpisode.id) {
        heardEpisode = currentEpisode.id;
        hearEpisode();
      }
      if (event.data === YT.PlayerState.PLAYING) {
        if (progressTimer) clearInterval(progressTimer);
        progressTimer = setInterval(rememberSpot, 5000);
      }
      if (event.data === YT.PlayerState.PAUSED) rememberSpot();
      if (event.data === YT.PlayerState.ENDED) {
        rememberSpot();
        offerNext();
      }
    }

    function bootPlayer(id, start) {
      const ready = () => {
        ytPlayer = new YT.Player("ytPlayer", {
          videoId: id,
          width: "100%",
          height: "100%",
          playerVars: { rel: 0, playsinline: 1, mute: 0, start: start || 0 },
          events: {
            onReady: hearEpisode,
            onStateChange: onEpisodeState
          }
        });
      };
      if (window.YT && YT.Player) ready();
      else {
        window.onYouTubeIframeAPIReady = ready;
        if (!document.querySelector("script[src*='iframe_api']")) {
          const script = document.createElement("script");
          script.src = "https://www.youtube.com/iframe_api";
          document.head.appendChild(script);
        }
      }
    }

    function watchEpisode(id, section, title) {
      if (audio.src && !audio.paused) {
        pausedForLive = true;
        audio.pause();
        setRadio("Paused for live TV", "▶");
      }
      currentEpisode = { id, title: title || "Episode", section: section || "" };
      leaveLive();
      document.getElementById("home").hidden = true;
      const stage = document.getElementById("stage");
      stage.hidden = false;
      stage.classList.remove("cataloguing");
      stage.classList.add("episode");
      offline.classList.remove("show");
      returnBar.classList.add("show");
      document.getElementById("shareEpisode").hidden = false;
      document.getElementById("upNext").hidden = true;
      markTab(null);
      const start = (progressMap()[id] && progressMap()[id].seconds) || 0;
      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById({ videoId: id, startSeconds: start });
        hearEpisode();
      }
      else bootPlayer(id, start);
    }

    function followButton(title) {
      const follow = document.createElement("button");
      follow.type = "button";
      follow.className = "follow";
      const on = follows().includes(title);
      follow.textContent = on ? "Following" : "Follow";
      follow.setAttribute("aria-pressed", on ? "true" : "false");
      follow.addEventListener("click", async () => {
        const list = follows().filter((name) => name !== title);
        if (!on) list.push(title);
        localStorage.setItem("afia-follows", JSON.stringify(list));
        if (!on && "Notification" in window && Notification.permission === "default") {
          try { await Notification.requestPermission(); } catch (error) { /* the row still follows */ }
        }
        paintHomeRows();
        paintProgrammes();
        watchFollows();
      });
      return follow;
    }

    async function watchFollows() {
      if (!programmes || Notification.permission !== "granted" || !("serviceWorker" in navigator)) return;
      const registration = await navigator.serviceWorker.ready;
      const seen = JSON.parse(localStorage.getItem("afia-follow-seen") || "{}");
      let changed = false;
      follows().forEach((title) => {
        const section = (programmes.sections || []).find((row) => row.title === title);
        const latest = section && section.episodes && section.episodes[0];
        if (!latest) return;
        if (seen[title] && seen[title] !== latest.id) {
          registration.showNotification(title, {
            body: latest.title,
            tag: "afia-follow-" + title,
            data: { url: "./" }
          });
        }
        if (seen[title] !== latest.id) {
          seen[title] = latest.id;
          changed = true;
        }
      });
      if (changed) localStorage.setItem("afia-follow-seen", JSON.stringify(seen));
    }

    function paintHomeRows() {
      const block = document.getElementById("continueBlock");
      const rail = document.getElementById("continueRail");
      if (!block || !rail) return;
      const rows = [];
      try {
        const last = JSON.parse(localStorage.getItem("afia-last") || "null");
        if (last && last.id) rows.push(last);
      } catch (error) { /* no episode in progress */ }
      laterItems().forEach((row) => {
        if (!rows.some((item) => item.id === row.id)) rows.push(row);
      });
      block.hidden = rows.length === 0;
      rail.replaceChildren(...rows.slice(0, 12).map((row) => episodeCard(row, row.section || "", row.title)));
      paintStats();
      const homeRows = document.getElementById("homeRows");
      const sections = (programmes && programmes.sections) || [];
      const picked = HOME_SHOWS.map((name) => sections.find((row) => row.title.toUpperCase() === name)).filter(Boolean);
      const shown = picked.length ? picked : sections.slice(0, 4);
      homeRows.replaceChildren(...shown.map((section) => {
        const wrap = document.createElement("section");
        const head = document.createElement("div");
        head.className = "row-head";
        const heading = document.createElement("h2");
        heading.textContent = section.title;
        head.append(heading, followButton(section.title));
        const strip = document.createElement("div");
        strip.className = "rail";
        (section.episodes || []).slice(0, 8).forEach((row) => strip.append(episodeCard(row, section.title, row.title)));
        wrap.append(head, strip);
        return wrap;
      }));
    }

    function countLabel(value, word) {
      const count = Number(value) || 0;
      const text = count >= 1000000
        ? (count / 1000000).toFixed(1).replace(/\.0$/, "") + "m"
        : count >= 1000
          ? (count / 1000).toFixed(1).replace(/\.0$/, "") + "k"
          : String(count);
      return text + " " + word;
    }

    function paintStats() {
      const root = document.getElementById("statRows");
      const stats = (programmes && programmes.stats) || {};
      const rows = [
        ["Most played", stats.mostPlayed, (row) => countLabel(row.views, "plays")],
        ["Most liked", stats.mostLiked, (row) => countLabel(row.likes, "likes")],
        ["Trending", stats.trending, (row) => countLabel(row.views, "plays")],
        ["Most commented", stats.mostCommented, (row) => countLabel(row.comments, "comments")]
      ].filter((row) => Array.isArray(row[1]) && row[1].length);
      root.replaceChildren(...rows.map((entry) => {
        const [label, items, note] = entry;
        const wrap = document.createElement("section");
        const heading = document.createElement("h2");
        heading.textContent = label;
        const strip = document.createElement("div");
        strip.className = "rail";
        items.forEach((row) => strip.append(episodeCard(row, row.section || "", row.title, note(row))));
        wrap.append(heading, strip);
        return wrap;
      }));
    }

    function episodeCard(row, section, title, note) {
      const wrap = document.createElement("div");
      wrap.className = "episode";
      const card = document.createElement("button");
      card.type = "button";
      card.className = "poster";
      const img = document.createElement("img");
      img.alt = "";
      img.src = "https://i.ytimg.com/vi/" + row.id + "/hqdefault.jpg";
      const name = document.createElement("b");
      name.textContent = title || row.title;
      card.append(img, name);
      if (note) {
        const meta = document.createElement("span");
        meta.textContent = note;
        card.append(meta);
      }
      card.addEventListener("click", () => watchEpisode(row.id, section, title || row.title));
      const saved = laterItems().some((item) => item.id === row.id);
      const mark = document.createElement("button");
      mark.type = "button";
      mark.className = "mark";
      mark.setAttribute("aria-label", saved ? "Remove from watch later" : "Watch later");
      mark.setAttribute("aria-pressed", saved ? "true" : "false");
      mark.innerHTML = saved ? MARK.on : MARK.off;
      mark.addEventListener("click", () => {
        const next = laterItems().filter((item) => item.id !== row.id);
        if (!saved) next.unshift({ id: row.id, title: title || row.title, section });
        localStorage.setItem("afia-later", JSON.stringify(next.slice(0, 60)));
        paintProgrammes();
        paintHomeRows();
      });
      wrap.append(card, mark);
      return wrap;
    }

    function paintProgrammes() {
      const root = document.getElementById("programmeList");
      const query = (document.getElementById("showSearch").value || "").trim().toLowerCase();
      const blocks = [];
      if (!query) {
        const later = laterItems();
        if (later.length) blocks.push({ title: "Watch later", episodes: later, follow: false });
        (programmes && programmes.sections || []).forEach((section) => {
          blocks.push({ title: section.title, episodes: section.episodes || [], follow: true });
        });
      } else {
        const hits = [];
        (programmes && programmes.sections || []).forEach((section) => {
          (section.episodes || []).forEach((row) => {
            if (row.title.toLowerCase().includes(query)) hits.push({ ...row, section: section.title });
          });
        });
        blocks.push({ title: hits.length ? "Results" : "Nothing matches", episodes: hits, follow: false });
      }
      root.replaceChildren(...blocks.map((block) => {
        const section = document.createElement("section");
        const head = document.createElement("div");
        head.className = "row-head";
        const heading = document.createElement("h2");
        heading.textContent = block.title;
        head.append(heading);
        if (block.follow) head.append(followButton(block.title));
        const rail = document.createElement("div");
        rail.className = "rail";
        block.episodes.forEach((row) => rail.append(episodeCard(row, row.section || block.title, row.title)));
        section.append(head, rail);
        return section;
      }));
    }

    async function ensureProgrammes() {
      if (programmes) return programmes;
      try {
        const response = await fetch("programmes.json", { cache: "no-store" });
        if (response.ok) {
          programmes = await response.json();
          localStorage.setItem("afia-programmes", JSON.stringify(programmes));
        }
      } catch (error) { /* use the copy kept on this phone */ }
      if (!programmes) {
        try { programmes = JSON.parse(localStorage.getItem("afia-programmes") || "null"); }
        catch (error) { programmes = null; }
      }
      if (!programmes) programmes = { sections: [] };
      return programmes;
    }

    async function openLibrary() {
      leaveLive();
      document.getElementById("home").hidden = true;
      const stage = document.getElementById("stage");
      stage.hidden = false;
      stage.classList.add("cataloguing");
      stage.classList.remove("episode");
      document.getElementById("upNext").hidden = true;
      pauseEpisode();
      offline.classList.remove("show");
      returnBar.classList.remove("show");
      markTab("library");
      await ensureProgrammes();
      paintProgrammes();
    }

    function paintHome(feed) {
      if (!feed) return;
      const current = feed.onAir && feed.onAir.show ? feed.onAir : (feed.today || [])[0];
      if (current && current.show) {
        document.getElementById("nowTitle").textContent = current.show.title;
        const host = current.show.host && current.show.host.name;
        document.getElementById("nowMeta").textContent = [current.startTime && current.endTime ? current.startTime + "–" + current.endTime : "On 99.3", host, "Watch live"].filter(Boolean).join(" · ");
      }
      const today = feed.today || [];
      const rail = document.getElementById("todayRail");
      rail.replaceChildren(...today.map((row) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "slot";
        card.innerHTML = "<b></b><span></span>";
        card.querySelector("b").textContent = (row.show && row.show.title) || "Afia 99.3";
        card.querySelector("span").textContent = [row.startTime, row.show && row.show.host && row.show.host.name].filter(Boolean).join(" · ");
        card.addEventListener("click", () => document.getElementById("lineup").click());
        return card;
      }));
      const host = current && current.show && current.show.host && current.show.host.name;
      const next = today.find((row) => row !== current && row.show);
      document.getElementById("liveNow").textContent = (current && current.show && current.show.title) || "Afia TV";
      document.getElementById("liveNext").textContent = [host, next && next.show ? "Next " + next.show.title : "Watch the channel"].filter(Boolean).join(" · ");
      if (radioStatus.textContent === "Tap to listen" && current && current.show) {
        setRadio([current.show.title, host].filter(Boolean).join(" · "), "▶");
      }
      paintHomeRows();
    }

    function tick() {
      const clock = document.getElementById("clock");
      clock.textContent = new Date().toLocaleTimeString("en-GB", { timeZone: "Africa/Lagos", hour: "2-digit", minute: "2-digit" }) + " WAT";
    }
    tick();
    setInterval(tick, 30000);

    function showOffline() {
      document.getElementById("home").hidden = true;
      document.getElementById("stage").hidden = false;
      markTab("library");
      document.getElementById("offlineText").textContent = navigator.onLine
        ? "Afia TV didn't open. The site didn't answer. Saved episodes on this phone are still here."
        : "You're offline. Live TV needs a connection. Pictures and details of saved episodes stay on this phone. Playing one needs a connection, because Afia hosts them on YouTube.";
      offline.classList.add("show");
      paintSaved();
    }

    document.getElementById("retryFrame").addEventListener("click", () => {
      offline.classList.remove("show");
      frame.src = frame.src;
    });
    document.getElementById("shareEpisode").addEventListener("click", async () => {
      if (!currentEpisode) return;
      const url = "https://www.youtube.com/watch?v=" + currentEpisode.id;
      const data = { title: currentEpisode.title, text: currentEpisode.title, url };
      if (navigator.share) {
        try { await navigator.share(data); } catch (error) { /* the sheet was dismissed */ }
      } else if (navigator.clipboard) {
        try { await navigator.clipboard.writeText(url); } catch (error) { /* share is unavailable */ }
      }
    });
    document.getElementById("upNextPlay").addEventListener("click", () => {
      const bar = document.getElementById("upNext");
      watchEpisode(bar.dataset.id, bar.dataset.section, bar.dataset.title);
    });
    document.getElementById("showSearch").addEventListener("input", () => paintProgrammes());
    document.getElementById("openSaved").addEventListener("click", () => {
      sheet.classList.remove("show");
      openLibrary();
    });
    window.addEventListener("offline", showOffline);
    window.addEventListener("online", () => offline.classList.remove("show"));
    if (!navigator.onLine) showOffline();
    refreshLibrary();
    document.querySelectorAll("[data-close]").forEach((button) => {
      button.addEventListener("click", () => {
        const popup = button.closest(".sheet");
        popup.classList.remove("show", "min");
        const shrink = popup.querySelector("[data-min]");
        if (shrink) shrink.textContent = "Minimize";
      });
    });
    document.querySelectorAll("[data-min]").forEach((button) => {
      button.addEventListener("click", () => {
        const popup = button.closest(".sheet");
        const shrunk = popup.classList.toggle("min");
        button.textContent = shrunk ? "Show again" : "Minimize";
      });
    });
    const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
    const iphone = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (iphone && !standalone) {
      document.getElementById("addPhone").hidden = false;
      const install = document.getElementById("install");
      install.hidden = false;
      install.innerHTML = "Add to iPhone<small>Tap Share, then Add to Home Screen</small>";
    }
    document.getElementById("addPhone").addEventListener("click", () => sheet.classList.add("show"));
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstall = event;
      document.getElementById("install").hidden = false;
      document.getElementById("addPhone").hidden = false;
      document.getElementById("addPhone").innerHTML = "Install Afia<small>Add this app to your phone</small>";
    });
    document.getElementById("install").addEventListener("click", async () => {
      if (!deferredInstall) return;
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      deferredInstall = null;
      document.getElementById("install").hidden = true;
      document.getElementById("addPhone").hidden = true;
      sheet.classList.remove("show");
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
